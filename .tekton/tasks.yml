apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Remove previous files from the shared source workspace.
  workspaces:
    - name: source
  steps:
    - name: remove-workspace-contents
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Install development dependencies and run Python unit tests with nose.
  workspaces:
    - name: source
  steps:
    - name: run-nose-tests
      image: python:3.10-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --disable-pip-version-check -r requirements-dev.txt
        nosetests -v
